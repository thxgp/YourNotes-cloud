apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-notes-app
  labels:
    app: secure-notes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-notes
  template:
    metadata:
      labels:
        app: secure-notes
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: secure-notes-container
          image: yournotes-cloud:latest # Replace with ECR/DockerHub URL
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
